# Lower priority of the StarTech Thunderbolt 3 dock's built-in USB audio codec
# (TI PCM2912A) so it doesn't hijack audio from Bluetooth headphones or the
# laptop's built-in speakers/mic (priority ~1009) when plugged in.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Burr-Brown_from_TI_USB_audio_CODEC-.*"
      }
      {
        node.name = "~alsa_input.usb-Burr-Brown_from_TI_USB_audio_CODEC-.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 500
        priority.session = 500
      }
    }
  }
]
