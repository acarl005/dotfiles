# Enable fine-grained Runtime D3 (RTD3) power management (powers off VRAM when idle)
# and S0ix modern standby support for NVIDIA dGPUs.
# See https://wiki.archlinux.org/title/PRIME#PCI-Express_Runtime_D3_(RTD3)_Power_Management
options nvidia "NVreg_DynamicPowerManagement=0x02"
options nvidia "NVreg_EnableS0ixPowerManagement=1"
